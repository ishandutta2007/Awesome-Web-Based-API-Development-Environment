<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing accent gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters for glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .code-line {
        font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        fill: #64748b;
      }

      /* CSS Dynamic Keyframe Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes radarSweep {
        0% { stroke-dashoffset: 280; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes ping {
        0% { r: 4px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }

      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
      .pulse-orb {
        transform-origin: center;
        animation: pulseGlow 5s ease-in-out infinite;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: radarSweep 12s linear infinite;
      }
      .ping-circle {
        animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Orbs / Glows (strictly background) -->
  <g class="pulse-orb" opacity="0.35">
    <circle cx="150" cy="80" r="130" fill="#6366f1" filter="url(#glow)" />
    <circle cx="1080" cy="280" r="150" fill="#ec4899" filter="url(#glow)" />
    <circle cx="850" cy="70" r="110" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- Cyber Grid Pattern (Subtle) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Dynamic Connecting Network Lines (Behind Foreground) -->
  <path d="M 780 180 C 850 120, 920 220, 1020 150" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" class="dash-flow" />
  <path d="M 820 260 C 900 310, 980 200, 1100 230" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4" class="dash-flow" />

  <!-- Animated Dynamic Card 1: API Request Preview (Right side) -->
  <g class="floating-card-1" transform="translate(820, 45)">
    <rect width="320" height="135" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="20" r="4" fill="#ef4444" />
    <circle cx="34" cy="20" r="4" fill="#f59e0b" />
    <circle cx="48" cy="20" r="4" fill="#10b981" />
    <rect x="70" y="12" width="70" height="16" rx="4" fill="#0284c7" opacity="0.25" />
    <text x="78" y="24" class="code-line" fill="#38bdf8" font-weight="700">POST /api/v1</text>
    <text x="16" y="55" class="code-line">Host: api.cloud.workspace</text>
    <text x="16" y="73" class="code-line">Authorization: Bearer ●●●●●●●●</text>
    <text x="16" y="91" class="code-line">Content-Type: application/json</text>
    <rect x="16" y="104" width="84" height="18" rx="4" fill="#10b981" opacity="0.2" />
    <text x="24" y="117" class="code-line" fill="#34d399" font-weight="700">200 OK • 18ms</text>
  </g>

  <!-- Animated Dynamic Card 2: Microservices / Protocol Nodes (Bottom Right) -->
  <g class="floating-card-2" transform="translate(860, 205)">
    <rect width="280" height="110" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <!-- Pulse dot -->
    <circle cx="28" cy="28" r="5" fill="#10b981" />
    <circle cx="28" cy="28" r="5" fill="#10b981" class="ping-circle" />
    <text x="44" y="32" class="pill-text" font-size="12px">Web Mock &amp; Test Runner</text>
    
    <!-- Mini Progress / Stats -->
    <line x1="28" y1="52" x2="252" y2="52" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="52" x2="198" y2="52" stroke="url(#primaryGlow)" stroke-width="4" stroke-linecap="round" />
    
    <text x="28" y="74" class="code-line">Spec: OpenAPI 3.1 • GraphQL</text>
    <text x="28" y="92" class="code-line">Status: Ready in browser</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badges, Title & Subtitle (Always in front) -->
  <g transform="translate(60, 40)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" class="tag-text">⚡ CURATED DEVELOPER TOOLKIT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">
      Web-Based <tspan fill="url(#primaryGlow)">API Development</tspan>
    </text>
    <text x="0" y="128" class="title-text">
      Environment 🚀
    </text>

    <!-- Subtitle (Clear, readable, high contrast) -->
    <text x="0" y="172" class="subtitle-text">
      Top SaaS platforms &amp; open-source browser tools for testing, mocking,
    </text>
    <text x="0" y="198" class="subtitle-text">
      collaborating, and designing APIs directly in your browser.
    </text>

    <!-- Interactive Badges / Tags in Foreground -->
    <g transform="translate(0, 235)">
      <!-- REST / GraphQL Tag -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="22" class="pill-text">🌐 REST &amp; GraphQL</text>

      <!-- Mock Server Tag -->
      <rect x="142" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="156" y="22" class="pill-text">🎭 Mock Servers</text>

      <!-- OpenAPI 3.1 Tag -->
      <rect x="289" y="0" width="125" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="303" y="22" class="pill-text">📑 OpenAPI 3.1</text>

      <!-- Open Source Tag -->
      <rect x="426" y="0" width="125" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="440" y="22" class="pill-text">✨ Open-Source</text>
    </g>
  </g>

  <!-- Border Outline for Banner Card -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1" />
</svg>
