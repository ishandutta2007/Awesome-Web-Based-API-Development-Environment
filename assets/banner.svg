<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanBlue" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(.5deg)}}@keyframes floatReverse{0%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes radarSweep{0%{stroke-dashoffset:280}}@keyframes ping{0%{r:4px;opacity:1}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;fill:#94a3b8}.pill-text,.tag-text{font-weight:600;font-size:13px}.tag-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#38bdf8}.pill-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,sans-serif;fill:#e2e8f0}.code-line{font-family:ui-monospace,Menlo,Monaco,Consolas,monospace;font-size:11px;fill:#64748b}.floating-card-1{animation:floatSlow 7s ease-in-out infinite}.floating-card-2{animation:floatReverse 6s ease-in-out infinite}.pulse-orb{transform-origin:center;animation:pulseGlow 5s ease-in-out infinite}.dash-flow{stroke-dasharray:8 6;animation:radarSweep 12s linear infinite}.ping-circle{animation:ping 2.5s cubic-bezier(0,0,.2,1) infinite}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g class="pulse-orb" opacity=".35"><circle cx="150" cy="80" r="130" fill="#6366f1" filter="url(#glow)"/><circle cx="1080" cy="280" r="150" fill="#ec4899" filter="url(#glow)"/><circle cx="850" cy="70" r="110" fill="#06b6d4" filter="url(#glow)"/></g><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="120" x2="120" y1="0" y2="360"/><line x1="240" x2="240" y1="0" y2="360"/><line x1="360" x2="360" y1="0" y2="360"/><line x1="480" x2="480" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="720" x2="720" y1="0" y2="360"/><line x1="840" x2="840" y1="0" y2="360"/><line x1="960" x2="960" y1="0" y2="360"/><line x1="1080" x2="1080" y1="0" y2="360"/></g><path fill="none" stroke="#6366f1" stroke-width="2" d="M 780 180 C 850 120, 920 220, 1020 150" class="dash-flow" opacity=".4"/><path fill="none" stroke="#06b6d4" stroke-width="2" d="M 820 260 C 900 310, 980 200, 1100 230" class="dash-flow" opacity=".4"/><g class="floating-card-1" transform="translate(820, 45)"><rect width="320" height="135" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" rx="12"/><circle cx="20" cy="20" r="4" fill="#ef4444"/><circle cx="34" cy="20" r="4" fill="#f59e0b"/><circle cx="48" cy="20" r="4" fill="#10b981"/><rect width="70" height="16" x="70" y="12" fill="#0284c7" opacity=".25" rx="4"/><text x="78" y="24" fill="#38bdf8" clas